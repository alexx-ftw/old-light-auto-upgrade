name: Chromium extended observation diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OVERLAY_BROWSER_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact baseline suite and production sources
        run: |
          git diff --exit-code 997a641b84b3d197cc17f322512e38a3f8de0dad HEAD -- tests/ old-light-auto-upgrade.user.js old-light-auto-upgrade.meta.js docs/conquest-core.js docs/conquest-controller.js docs/conquest-panel.js validate-release.cjs
          test "$(git ls-files '*.test.cjs' | wc -l)" -eq 113
          stat -Lc 'LAUNCHER_BYTES=%s' /usr/bin/chromium
          getconf CLK_TCK
          node --version
      - name: Provision pinned public modules without launching browser
        run: NODE_USE_ENV_PROXY=1 node tools/native-scene-assets.cjs
      - name: Check diagnostic acceptance controls
        run: node tools/chromium-startup-observation-selfcheck.cjs
      - name: Observe complete baseline suite with sticky fifteen second failure
        run: |
          set +e
          mapfile -t files < <(git ls-files '*.test.cjs')
          timeout --signal=TERM --kill-after=5s 600s node --require ./tools/chromium-startup-observation-preload.cjs --test --test-concurrency=1 --test-timeout=120000 "${files[@]}" > "$RUNNER_TEMP/startup-observation-suite.log" 2>&1
          suite_status=$?
          node tools/chromium-startup-observation-result.cjs
          observation_status=$?
          echo "DIAGNOSTIC_SUITE_EXIT=$suite_status"
          echo "DIAGNOSTIC_OBSERVATION_EXIT=$observation_status"
          if [ "$suite_status" -ne 0 ] || [ "$observation_status" -ne 0 ]; then exit 1; fi
      - name: Record launcher hash only after the observed suite
        if: always()
        run: sha256sum /usr/bin/chromium
      - name: Print bounded diagnostic evidence and explicit non-validation status
        if: always()
        run: |
          node tools/chromium-startup-observation-result.cjs
      - name: Preserve observation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-extended-observation
          path: |
            /tmp/oldlight-startup-observation/*.json
            ${{ runner.temp }}/startup-observation-suite.log
          if-no-files-found: warn
